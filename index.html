<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калкулатор за проектиране - Част Конструкции (СК)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light">

    <button id="theme-toggle" class="action-button theme-toggle-button" title="Превключване на тема">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.106a.75.75 0 010 1.06l-1.591 1.59a.75.75 0 11-1.06-1.061l1.59-1.591a.75.75 0 011.062 0zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5h2.25a.75.75 0 01.75.75zM17.836 17.894a.75.75 0 011.06 0l1.591 1.59a.75.75 0 11-1.06 1.061l-1.59-1.591a.75.75 0 010-1.06zM12 21.75a.75.75 0 01-.75-.75v-2.25a.75.75 0 011.5 0V21a.75.75 0 01-.75-.75zM5.106 17.894a.75.75 0 010-1.06l1.591-1.59a.75.75 0 111.06 1.061l-1.59 1.591a.75.75 0 01-1.062 0zM3 12a.75.75 0 01.75-.75h2.25a.75.75 0 010 1.5H3.75A.75.75 0 013 12zM6.164 6.106a.75.75 0 01-1.06 0L3.513 4.515a.75.75 0 111.06-1.061l1.591 1.59a.75.75 0 010 1.06z"></path></svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 004.472-.948a.75.75 0 01.82.162l.805.806a.75.75 0 01-.162.82a10.488 10.488 0 01-5.051 2.872.75.75 0 01-.635-.412A8.97 8.97 0 0015 15.75a9 9 0 00-5.948-8.528.75.75 0 01-.412-.635A10.488 10.488 0 012.87 1.987l.806.805a.75.75 0 01.82-.162z" clip-rule="evenodd"></path></svg>
    </button>
    
    <h1>Калкулатор за минимална себестойност на проектиране – ЧАСТ КОНСТРУКЦИИ (СК)</h1>
    
    <div class="main-container">
        <div class="calculator-container">
            <div class="main-content">
                <div id="mainSection" class="section">
                    <h2>Основни параметри</h2>
                    <div class="form-group">
                        <label for="projectType">Вид строителен проект:</label>
                        <select id="projectType" class="calc-input"></select>
                    </div>
                    <div id="areaInput" class="form-group" style="display: none;">
                        <label for="area">Площ (м²):</label>
                        <input type="number" id="area" class="calc-input" min="0" placeholder="Въведете площ">
                    </div>
                    <div id="wallSectionsGroup" class="form-group" style="display: none;">
                        <label>Параметри за подпорни стени:</label>
                        <input type="number" id="wallSections" class="calc-input" min="1" value="1" title="Брой сечения" placeholder="Брой сечения">
                        <input type="number" id="additionalLength" class="calc-input" min="0" value="0" title="Допълнителна дължина (м)" placeholder="Доп. дължина (м)" style="margin-top: 5px;">
                    </div>
                </div>
                
                <div class="total-section">
                    <h2 id="displayObjectName"></h2>
                    <h2 id="totalHeader">ОБЩО (€ без ДДС):</h2>
                    <p id="totalPrice">0.00 €</p>
                    <pre id="calculationLog">Моля, изберете вид проект.</pre>
                    <div class="button-group">
                        <button id="printButton" class="action-button">Принтирай</button>
                        <button id="exportTxtButton" class="action-button">Експорт (.txt)</button>
                    </div>
                </div>
            </div>

            <div class="sidebar">
                <h3>Проект</h3>
                <div class="form-group"><label for="objectName">Име на обект:</label><input type="text" id="objectName" class="calc-input" placeholder="напр. Еднофамилна къща в..."></div>
                <div class="form-group">
                    <button id="saveButton" class="action-button" title="Запазва калкулацията">Запази</button>
                    <button id="loadButton" class="action-button" title="Зарежда калкулация">Отвори</button>
                    <button id="resetButton" class="action-button" title="Изчиства всичко">Изчисти</button>
                    <input type="file" id="loadInput" accept=".json" style="display: none;">
                </div>
                <hr>
                <h3>Настройки</h3>
                <div class="form-group"><button id="openTableBtn" class="action-button" style="width: 100%;">Отвори таблица с цени</button></div>
                <div class="form-group"><label for="currencyDisplay">Валута:</label><select id="currencyDisplay" class="calc-input"><option value="eur">в евро (€)</option><option value="bgn">в лева (лв.)</option><option value="both">в лева и евро</option></select></div>
                <hr>
                
                <!-- *** НОВ ОБГРЪЩАЩ DIV *** -->
                <div id="coefficientsSection">
                    <h3>Допълнителни коефициенти</h3>
                    <div id="craneCheckbox" class="form-group custom-checkbox" style="display: none;"><input type="checkbox" id="hasCrane" class="calc-input"><label for="hasCrane">Хале с кран (+1.00 €/м²)</label></div>
                    <div class="form-group custom-checkbox"><input type="checkbox" id="hasComplexity" class="calc-input"><label for="hasComplexity">Сложна геометрия/терен</label></div>
                    <div id="complexityPercentageGroup" class="form-group" style="display: none;"><label for="complexityPercentage">Процент (+%):</label><input type="number" id="complexityPercentage" class="calc-input" min="0" max="100" placeholder="напр. 15"></div>
                    <div class="form-group custom-checkbox"><input type="checkbox" id="includeSupervision" class="calc-input"><label for="includeSupervision">Авторски надзор (+15%)</label></div>
                </div>

            </div>
        </div>
    </div>
    
    <footer>
         <p class="copyright">© <span id="copyright-year">2025</span> Калкулатор СК. Всички права запазени.</p>
    </footer>

    <div id="priceTableContainer" style="display: none;"></div>

    <script src="js/data.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
